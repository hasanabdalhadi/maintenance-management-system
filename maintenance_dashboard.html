
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <img src="logo.png" alt="Company Logo" class="logo">
        <h1>Maintenance Requests Dashboard</h1>
    </header>
    <main>
        <section class="status-tracker">
            <h2>Complaint Tracker</h2>
            <div class="complaint-card">
                <h3>Complaint ID: #12345</h3>
                <p>Status: <span class="status in-progress">In Progress</span></p>
                <p>Description: AC not working properly in Apartment 304</p>
                <p>Date Submitted: 2025-07-23</p>
            </div>
        </section>
    </main>
</body>
</html>
